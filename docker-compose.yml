services:
  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      ARBITER_HOST: "0.0.0.0"
      ARBITER_PORT: "8080"
      ARBITER_OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      ARBITER_ROUTING_MODE: "active"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    depends_on:
      - prometheus
