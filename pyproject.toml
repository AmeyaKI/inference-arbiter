[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-arbiter"
version = "0.1.0"
description = "OpenAI-compatible gateway with complexity-based LLM routing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "locust>=2.32.0",
]

[project.scripts]
inference-arbiter = "inference_arbiter.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/inference_arbiter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
